version: '3.8'

services:
  telebook-server:
    build:
      context: ../../
      dockerfile: apps/local-server/Dockerfile
    container_name: telebook-local-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - OWNER_TELEGRAM_ID=${OWNER_TELEGRAM_ID:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - STORAGE_MODE=${STORAGE_MODE:-auto}
      - TELEBOOK_SECRET_KEY=${TELEBOOK_SECRET_KEY:-}
      - TELEGRAM_API_URL=${TELEGRAM_API_URL:-https://api.telegram.org}
      - TELEGRAM_LOCAL_MODE=${TELEGRAM_LOCAL_MODE:-false}
      - WATCH_DIR=/app/notebooks
      - WATCH_PASSKEY=${WATCH_PASSKEY:-}
      - ENABLE_BOT_POLLER=${ENABLE_BOT_POLLER:-false}
    volumes:
      - telebook-data:/app/data
      - ./notebooks:/app/notebooks

  # Optional local Telegram Bot API server for >50 MB (up to 2 GB) file transfers
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telebook-bot-api
    restart: unless-stopped
    profiles:
      - local-bot-api
    ports:
      - "8081:8081"
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_LOCAL=true
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telebook-data:
  telegram-bot-api-data:
