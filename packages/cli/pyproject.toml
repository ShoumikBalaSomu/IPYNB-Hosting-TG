[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "telebook"
version = "1.0.0"
description = "Sovereign, zero-knowledge CLI for TeleBook Jupyter Notebook hosting"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "TeleBook Core Team"}
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.25.0",
    "rich>=13.0.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "watchfiles>=0.20.0"
]

[project.scripts]
telebook = "telebook.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["telebook*"]
