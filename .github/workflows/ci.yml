name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npm run --workspace=packages/shared typecheck
          npm run --workspace=apps/worker typecheck

      - name: Run JS/TS test suites
        run: npm test

      - name: Install Python CLI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./packages/cli[test] pytest pytest-asyncio fastapi httpx uvicorn cryptography

      - name: Run Python test suite
        run: |
          pytest packages/cli/tests apps/local-server/tests

      - name: Secret and Token Hygiene Audit
        run: |
          # Ensure no private tokens, keys, or dev vars leaked into repo
          if git grep -E '(ghp_[a-zA-Z0-9]{36}|glpat-[a-zA-Z0-9_\-\.]{20,}|[0-9]{8,10}:[a-zA-Z0-9_-]{35})'; then
            echo "ERROR: Disallowed secret token pattern detected in repository."
            exit 1
          fi
