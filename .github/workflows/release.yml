name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip build wheel

      - name: Build Python CLI distribution
        run: |
          cd packages/cli
          python -m build --sdist --wheel --outdir ../../dist/

      - name: Package Source Distributions
        run: |
          mkdir -p release-bundle
          TAG_NAME="${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="telebook-${TAG_NAME}/" "${TAG_NAME}" -o "release-bundle/telebook-${TAG_NAME}.tar.gz"
          git archive --format=zip --prefix="telebook-${TAG_NAME}/" "${TAG_NAME}" -o "release-bundle/telebook-${TAG_NAME}.zip"
          cp dist/*.whl release-bundle/ 2>/dev/null || true

      - name: Compute Checksums
        run: |
          cd release-bundle
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-bundle/*
          generate_release_notes: true
