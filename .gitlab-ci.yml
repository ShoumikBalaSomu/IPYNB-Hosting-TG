stages:
  - test
  - security
  - build

default:
  interruptible: true

variables:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

test:node:
  stage: test
  image: node:22-bullseye
  before_script:
    - npm ci
  script:
    - npm run --workspace=packages/shared typecheck
    - npm run --workspace=apps/worker typecheck
    - npm test

test:python:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git gcc libffi-dev && rm -rf /var/lib/apt/lists/*
    - python -m pip install --upgrade pip
    - pip install -e ./packages/cli[test] pytest pytest-asyncio fastapi httpx uvicorn cryptography
  script:
    - pytest packages/cli/tests apps/local-server/tests

security:secrets:
  stage: security
  image: alpine:latest
  before_script:
    - apk add --no-cache grep git
  script:
    - |
      echo "Auditing repository for high-entropy tokens..."
      if git grep -E '(ghp_[a-zA-Z0-9]{36}|glpat-[a-zA-Z0-9_\-\.]{20,}|[0-9]{8,10}:[a-zA-Z0-9_-]{35})'; then
        echo "FAIL: Disallowed secret token detected."
        exit 1
      fi
      echo "Secret hygiene scan passed."

pages:
  stage: build
  image: node:22-bullseye
  before_script:
    - npm ci
  script:
    - npm run --workspace=apps/web build
    - mkdir -p public
    - cp -r apps/web/dist/* public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
